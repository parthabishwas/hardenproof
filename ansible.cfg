[defaults]
inventory = inventory/example/hosts.yml
collections_path = ./collections
roles_path = ./roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml
# every run leaves a controller-side log: who ran what, against which host, with which result
log_path = ./reports/_logs/ansible.log
forks = 10

[ssh_connection]
# pipelining: modules are piped to the remote python instead of being written to a temp
# file and executed, so the playbooks keep working once /tmp and /dev/shm are noexec
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
