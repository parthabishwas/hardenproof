---
# Template inventory. Copy this directory to inventory/<your-env>/ and edit it.
#
# Credentials are never stored here:
#   HARDEN_SSH_PASS     - only for playbooks/bootstrap-access.yml, before the key is installed
#   HARDEN_BECOME_PASS  - sudo password of the automation user
all:
  children:
    servers:
      hosts:
        web01:
          ansible_host: 203.0.113.10      # documentation address - replace
          ansible_port: 22
          ansible_user: deploy            # a non-root sudo user; root SSH login gets disabled
  vars:
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_password: "{{ lookup('ansible.builtin.env', 'HARDEN_SSH_PASS') | default(omit, true) }}"
    ansible_become_password: "{{ lookup('ansible.builtin.env', 'HARDEN_BECOME_PASS') }}"
