---
# One-time, per host: install the automation public key. This is the only playbook that is
# expected to connect with a password (HARDEN_SSH_PASS).
#
#   HARDEN_SSH_PASS=... ansible-playbook playbooks/bootstrap-access.yml
- name: Install the automation SSH key
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Authorize the controller's public key for the automation user
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('ansible.builtin.file', ansible_ssh_private_key_file ~ '.pub') }}"
        comment: "HardenProof automation"

    - name: Prove that key-only login works
      ansible.builtin.command: >-
        ssh {{ hardening_probe_opts }} -o PasswordAuthentication=no {{ hardening_probe_target }} true
      delegate_to: localhost
      changed_when: false
